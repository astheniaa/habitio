name: habitio
description: Habit RPG Tracker - track your habits with RPG elements.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.2
  flutter_radar_chart: ^0.2.1
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
